name: image
on:
  push:
    paths: ['docker/**', '.github/workflows/image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/planner-ci" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: ci
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ hashFiles('docker/Dockerfile') }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Apt lock drift check
        run: |
          if [ -f docker/apt-lock.txt ]; then
            docker pull "$IMAGE:latest"
            docker/check-lock.sh "$IMAGE:latest"
          else
            echo "docker/apt-lock.txt absent; skipping"
          fi
